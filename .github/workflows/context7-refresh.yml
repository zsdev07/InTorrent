name: Refresh Context7 Docs

on:
  workflow_dispatch: 

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Context7 refresh
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          if [ -z "$CONTEXT7_API_KEY" ]; then
            echo "CONTEXT7_API_KEY is not configured; skipping refresh."
            exit 0
          fi

          curl --fail-with-body -sS -X POST https://context7.com/api/v1/refresh             -H "Content-Type: application/json"             -H "Authorization: Bearer $CONTEXT7_API_KEY"             -d '{"libraryName": "/zsdev07/InTorrent"}'
