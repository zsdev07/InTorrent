name: Pub.dev Quality Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pub-dev-check:
    name: Analyze, test, dry-run and Pana
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get
        
      - name: Run tests
        run: flutter test

      - name: Restore tool-generated analysis changes
        run: git checkout -- analysis_options.yaml

      - name: Verify clean git state
        run: |
          git status --short
          test -z "$(git status --short)"

      - name: Validate pub.dev package
        run: dart pub publish --dry-run

      - name: Install Pana
        run: dart pub global activate pana

      - name: Run Pana
        run: dart pub global run pana --no-warning .

      - name: Upload Pana report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pana-report
          path: |
            pana.json
            pana.html
          if-no-files-found: ignore
