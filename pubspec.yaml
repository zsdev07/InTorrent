name: intorrent
description: Flutter BitTorrent plugin using libtorrent and Dart FFI for magnet links, torrent status, file selection, streaming, and prefetching.
version: 0.0.1
homepage: https://github.com/zsdev07/InTorrent
repository: https://github.com/zsdev07/InTorrent
issue_tracker: https://github.com/zsdev07/InTorrent/issues

topics:
  - flutter
  - bittorrent
  - libtorrent
  - dart-ffi
  - magnet-links

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
